name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG=${{ github.event.inputs.tag }}
          else
            TAG=${{ github.ref_name }}
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"

      - name: Install dependencies
        shell: bash
        run: source .github/scripts/install-all-deps.sh ${{ runner.os }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-

      - name: Build release binaries
        id: build
        run: cargo build --verbose --locked --release
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
          CARGO_PROFILE_RELEASE_LTO: thin
          CFLAGS: -O3
          CXXFLAGS: -O3

      - name: Archive binaries
        id: archive
        run: |
          chmod +x .github/scripts/archive-binaries.sh
          .github/scripts/archive-binaries.sh
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Generate install script
        id: install
        run: |
          chmod +x .github/scripts/gen-install.sh
          .github/scripts/gen-install.sh
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Release ${{ steps.tag.outputs.tag }}
            
            ### 📦 Binaries Included
            - **Archive**: `${{ steps.archive.outputs.archive-name }}`
            - **Archive Size**: ${{ steps.archive.outputs.archive-size }}
            
            ### 🚀 Installation
            ```bash
            # Download and install
            sh -c "$(curl -sSfL ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/install.sh)"
            ```
            
            ### 📋 Changes
            - Auto-generated release from tag `${{ steps.tag.outputs.tag }}`
            
            ---
            *Built from commit: ${{ github.sha }}*
          files: |
            ${{ steps.archive.outputs.archive-path }}
            ${{ steps.archive.outputs.install-init }}
            ${{ steps.install.outputs.install }}

          draft: false
          prerelease: false
          token: ${{ github.token }}

      # Must be the LAST release-touching step in the job.
      # A testnet release is a full (non-prerelease) release but must NOT hold the
      # "Latest" badge. `--latest=false` cannot achieve this: it only un-pins, after
      # which GitHub's auto-selection (date, then highest semver) re-picks the testnet
      # tag because its semver is higher than mainnet. The reliable lever is the
      # opposite direction — positively pin the mainnet release with make_latest=true.
      - name: Keep 'Latest' on the mainnet release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}   # same source softprops uses (correct for workflow_dispatch)
        run: |
          set -euo pipefail

          # Testnet gate. MUST stay byte-identical to the mainnet/testnet rule used
          # elsewhere in the pipeline (major>4 || (major==4 && minor>1)). A future
          # v4.2.x *mainnet* cut must be reconciled HERE too, or it would be demoted.
          is_testnet() {
            [[ "$1" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]] || return 1
            local major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}"
            (( major > 4 || (major == 4 && minor > 1) ))
          }

          # Highest full (non-prerelease, non-draft, non-testnet) release tag, or empty.
          mainnet_latest() {
            gh release list --repo "$REPO" --limit 1000 \
                --json tagName,isPrerelease,isDraft \
                --jq '.[] | select(.isPrerelease==false and .isDraft==false) | .tagName' \
              | while IFS= read -r t; do is_testnet "$t" || printf '%s\n' "$t"; done \
              | sort -V | tail -n1
          }
          current_latest() {
            gh release list --repo "$REPO" --limit 1000 --json tagName,isLatest \
              --jq 'map(select(.isLatest) | .tagName) | .[0] // ""'
          }
          pin_latest() {
            local i; for i in 1 2 3; do
              gh release edit "$1" --repo "$REPO" --latest && return 0
              echo "pin attempt $i failed; retrying..."; sleep 5
            done; return 1
          }

          # Mainnet build keeps the badge softprops just gave it.
          if ! is_testnet "$TAG"; then
            echo "mainnet '$TAG' — leaving it as 'Latest'."; exit 0
          fi

          TARGET="$(mainnet_latest)"
          if [[ -z "$TARGET" ]]; then
            echo "::warning::no mainnet release exists to hold 'Latest'; '$TAG' stays latest."; exit 0
          fi

          echo "Pinning 'Latest' onto mainnet release: $TARGET"
          pin_latest "$TARGET" || { echo "::error::failed to pin 'Latest' onto '$TARGET'"; exit 1; }

          # Verify via the authoritative isLatest flag, polling for eventual consistency.
          NOW=""
          for i in 1 2 3 4 5 6; do
            NOW="$(current_latest 2>/dev/null || true)"
            [[ "$NOW" == "$TARGET" ]] && break
            echo "verify $i: 'Latest' on '${NOW:-<none>}' (want '$TARGET'); waiting..."; sleep 5
          done
          if [[ "$NOW" == "$TAG" ]]; then
            echo "::error::'Latest' still on testnet '$TAG' after pinning '$TARGET'"; exit 1
          fi
          echo "OK — '$TAG' is not latest; '${NOW:-<none>}' holds the badge."
