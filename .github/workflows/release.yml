name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG=${{ github.event.inputs.tag }}
          else
            TAG=${{ github.ref_name }}
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"

      - name: Install dependencies
        shell: bash
        run: source .github/scripts/install-all-deps.sh ${{ runner.os }}

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-

      - name: Build release binaries
        id: build
        run: cargo build --verbose --locked --release
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
          CARGO_PROFILE_RELEASE_LTO: thin
          CFLAGS: -O3
          CXXFLAGS: -O3

      - name: Fetch Solana Performance libraries
        run: |
          chmod +x fetch-perf-libs.sh
          ./fetch-perf-libs.sh

      - name: Archive binaries
        id: archive
        run: |
          chmod +x .github/scripts/archive-binaries.sh
          .github/scripts/archive-binaries.sh
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Generate install script
        id: install
        run: |
          chmod +x .github/scripts/gen-install.sh
          .github/scripts/gen-install.sh
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Release ${{ steps.tag.outputs.tag }}
            
            ### 📦 Binaries Included
            - **Archive**: `${{ steps.archive.outputs.archive-name }}`
            - **Archive Size**: ${{ steps.archive.outputs.archive-size }}
            
            ### 🚀 Installation
            ```bash
            # Download and install
            sh -c "$(curl -sSfL ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/install.sh)"
            ```
            
            ### 📋 Changes
            - Auto-generated release from tag `${{ steps.tag.outputs.tag }}`
            
            ---
            *Built from commit: ${{ github.sha }}*
          files: |
            ${{ steps.archive.outputs.archive-path }}
            ${{ steps.archive.outputs.install-init }}
            ${{ steps.install.outputs.install }}

          draft: false
          prerelease: false
          token: ${{ github.token }}

      - name: Manage latest flag
        run: |
          MAJOR=$(echo "${{ steps.tag.outputs.tag }}" | grep -oE '^v([0-9]+)' | tr -d 'v')
          
          if [[ "$MAJOR" -ge 4 ]]; then
            gh release edit "${{ steps.tag.outputs.tag }}" --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
